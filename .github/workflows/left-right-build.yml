name: LeftRight Audio Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'LeftRightApp/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'LeftRightApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x LeftRightApp/gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      working-directory: LeftRightApp

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      working-directory: LeftRightApp

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: leftright-debug-apk
        path: LeftRightApp/app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        name: leftright-release-apk
        path: LeftRightApp/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: leftright-v${{ github.run_number }}
        name: LeftRight Build ${{ github.run_number }}
        files: LeftRightApp/app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}