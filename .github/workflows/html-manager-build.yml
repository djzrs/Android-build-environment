name: HtmlManager Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'HtmlManager/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'HtmlManager/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x HtmlManager/gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      working-directory: HtmlManager

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      working-directory: HtmlManager

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: html-manager-debug-apk
        path: HtmlManager/app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        name: html-manager-release-apk
        path: HtmlManager/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: html-manager-v${{ github.run_number }}
        name: HtmlManager Build ${{ github.run_number }}
        files: HtmlManager/app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}